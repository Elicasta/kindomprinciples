name: Apply Kingdom Principles migration

on:
  workflow_dispatch:
  push:
    branches:
      - kingdom-principles-series
    paths:
      - kingdom-principles.js
      - scripts/apply-kingdom-principles.py
      - .github/workflows/apply-kingdom-principles.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kingdom-principles-series
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-kingdom-principles.py
      - name: Commit generated migration
        run: |
          if git diff --quiet; then
            echo "No generated changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire Kingdom Principles into live app"
          git push
